name: SSNG-Core
version: 1.0.0
main: fr.armersindustries.ssng.core.SSNG
author: Armerdu59 (Armer's Industries)
website: https://github.com/Armerdu59/ShadowState-NG
description: Boite a outils commune du pack ShadowState-NG (reseau NationsGUI, marqueurs, zones et colis NG).
commands:
  ssng:
    description: Etat du pack ShadowState-NG
    usage: /ssng
permissions:
  ssng.admin:
    description: Administration de tout le pack
    default: op
    children:
      ssng.hautstaff: true
      ssng.staff: true
  ssng.hautstaff:
    description: Haut staff (chefs de nation, assauts de nations)
    default: op
  ssng.staff:
    description: Staff
    default: op
