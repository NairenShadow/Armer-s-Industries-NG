name: SSNG-Iles
version: 1.0.0
main: fr.armersindustries.ssng.iles.IlesNG
author: Armerdu59 (Armer's Industries)
website: https://github.com/NairenShadow/Armer-s-Industries-NG
description: Les iles de NationsGlory (interface Iles du mod) dans un monde dedie, sans reglage.
depend: [SSNG-Core]
softdepend: [WorldEdit]
commands:
  ile:
    description: Iles (interface NationsGlory) - /i marche aussi
    usage: /ile [i|home|tp <numero>|spawn|aide]
    aliases: [iles]
permissions:
  ssng.iles.creer:
    description: Creer une ile
    default: true
  ssng.iles.worldedit:
    description: WorldEdit sur son ile
    default: op
