name: SSNG-Machines
version: 1.0.0
main: fr.armersindustries.ssng.machines.MachinesNG
author: Armerdu59 (Armer's Industries)
website: https://github.com/NairenShadow/Armer-s-Industries-NG
description: Machines NationsGlory (petrolier, gaz, reservoirs, silos), ateliers, entreprises et marches, recharge, vitrine des machines.
depend: [SSNG-Core, SSNG-Carte]
softdepend: [SSNG-Iles, SSNG-Ponts, SSNG-Ressources]
commands:
  machines:
    description: Vitrine des machines NationsGlory
    usage: /machines <tp|vitrine|liste>
    aliases: [vitrine]
  recharge:
    description: Recharge l'objet en main (energie, carburant, gaz) et le repare
    usage: /recharge [tout]
    aliases: [remplir]
  atelier:
    description: Recettes des ateliers NationsGlory (admins)
    usage: /atelier <liste|voir|ajouter|modifier|temps|ressource|retirer|categorie|supprcategorie|recharger>
    aliases: [ateliers]
  entreprise:
    description: Entreprises (petrole, electricite, agriculture, commerce) et marche des cereales
    usage: /entreprise [aide|voir|rejoindre|quitter|creer|reserve|prix|marche...]
    aliases: [entreprises, ent]
permissions:
  ssng.test:
    description: Acces a la vitrine et /recharge hors admin
    default: op
