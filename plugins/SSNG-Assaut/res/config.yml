# SSNG-Assaut (Armer's Industries) - fonctionne sans rien changer.
# Tout se regle aussi en jeu : /assautadmin regle
assaut:
  min-joueurs: 2
  # pause entre deux assauts
  pause-secondes: 300
  points-kill: 5
  capture:
    points: 1                # points gagnes...
    intervalle-secondes: 5   # ...toutes les 5 s passees dans la zone rouge
    taille: 10               # cote du carre de capture (tire au hasard sur le champ a chaque phase)
  nom-attaquants: Rouges
  nom-defenseurs: Bleus
  kit-attaquants: attaquants
  kit-defenseurs: defenseurs
  tableau-lateral: true
  durees:
    start: 30
    first_pvp: 120
    first_capture: 120
    second_pvp: 120
    second_capture: 120
    third_capture: 120
  # zone d'assaut de NationsGlory (carre transparent a lignes rouges) : elle marque le point de capture
  # pendant les phases de capture (absente pendant les phases PvP)
  zone-ng:
    actif: true
    vitesse: 4          # blocs par seconde
    couleur: "910707"
  # colis de NationsGlory qui tombe du ciel : le detruire rapporte des points et son contenu
  colis:
    actif: true
    phases: [1, 3]      # 1 = Phase 1 PvP, 3 = Phase 3 PvP (0 a 5)
    points: 50                    # points des attaquants quand ils detruisent le colis (eux seuls peuvent le frapper)
    pv: 500                       # points de vie du colis
    defense-points: 1             # tant que le colis tient : points des defenseurs...
    defense-intervalle-secondes: 10   # ...toutes les 10 s
    hauteur: 45
    entite: care_package
    contenu: ["322:0:2", "373:16421:2"]   # id:meta:quantite

# Assaut entre nations (/nation)
nations:
  assaut:
    duree-secondes: 900        # duree totale
    capture-secondes: 180      # nouvelle zone de capture toutes les ...
    colis-secondes: 240        # un colis toutes les ...
