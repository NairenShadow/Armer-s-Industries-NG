name: SSNG-Ponts
version: 1.0.0
main: fr.armersindustries.ssng.ponts.PontsNG
load: STARTUP
author: Armerdu59 (Armer's Industries)
website: https://github.com/NairenShadow/Armer-s-Industries-NG
description: Remplace les plugins prives du serveur officiel NationsGlory dont les mods ont besoin (machines, missiles, combat, marche...).
commands:
  ponts:
    description: Statistiques et reglages des ponts NG
    usage: /ponts [journal|reload]
    aliases: [ngcompat, ssng-ponts]
    permission: ssng.ponts.admin
permissions:
  ssng.ponts.admin:
    default: op
