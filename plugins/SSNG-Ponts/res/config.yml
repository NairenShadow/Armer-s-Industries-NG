# ==============================================================
#  PontsNG - reponses donnees aux mods NationsGlory
#  (a la place des plugins prives du serveur officiel)
#  Apres modification : /ngcompat reload
# ==============================================================

# Mondes ou les missiles (ICBM) peuvent etre lances et exploser.
# Liste vide ou "*" = partout.
mondes-missiles: []

# Mondes ou les armes NG (fusils, lasers...) peuvent toucher les joueurs.
mondes-combat: []

# Si le joueur n'est pas trouve (missile lance par une machine...) : autoriser ?
autoriser-si-monde-inconnu: true

# Points de missile disponibles par joueur
points-missile: 9999

# Ressources des machines : coefficient de la zone (1.0 = gisement normal,
# plus = production plus rapide). Partout, sans limite.
ressources:
  petrole: 1.0
  gaz: 1.0

# Niveau de recherche du "pays" (debloque les recettes/technologies)
niveau-recherche: 10
# Recherche militaire (13 et plus = lanceurs de missiles les plus precis)
niveau-recherche-militaire: 15

# Niveaux des metiers NG (ingenieur : 3+ = tirs plus precis, 4+ = degats renforces)
niveaux-metiers:
  engineer: 5

# Message au tireur : cible, distance, duree du vol, puis lieu de l'impact
messages-missiles: true

# Argent du joueur vu par les mods (marche, achats...)
argent: 1000000000

# Type de serveur annonce aux mods
type-serveur: blue

# Journal des appels dans la console (pour comprendre ce que demandent les mods)
journal:
  actif: true
  # nombre d'appels affiches par fonction (pour ne pas inonder la console)
  premiers-appels: 3
  # tout afficher (attention : beaucoup de lignes)
  tout: false

# Reponses forcees : reponses.<Plugin>.<fonction>: valeur
# Exemple :
#   reponses:
#     NationsGUI:
#       canPlayerInteractBlock: true
reponses: {}
