name: SSNG-Carte
version: 1.0.0
main: fr.armersindustries.ssng.carte.Carte
author: Armerdu59 (Armer's Industries)
website: https://github.com/Armerdu59/ShadowState-NG
description: Zones et territoires sur la carte NationsGlory, gestion des chunks depuis la carte, commandes /f.
depend: [SSNG-Core]
commands:
  zone:
    description: Zones (territoires) et leurs regles
    usage: /zone <liste|info|carte|creer|claim|unclaim|flags|flag|spawn|tp|reapparition>
  f:
    description: Commandes de territoire facon NationsGlory
    usage: /f <claim|unclaim|map|info|flags|liste>
